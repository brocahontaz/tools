server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; worker-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Hashed, immutable build assets
    location /assets/ {
        expires 1y;
    }

    # The entry document must always revalidate
    location = /index.html {
        expires -1;
    }

    # Multi-page site: serve existing files or directories, otherwise the 404 page
    error_page 404 /404.html;

    # Directory redirects (e.g. /jwt -> /jwt/) must stay relative. The container
    # listens on 8080 behind a public proxy; nginx's default absolute redirect
    # would leak "http://<public host>:8080/jwt/" and 404 in the browser.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }
}
