<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Compute SHA hashes of text locally — nothing leaves your browser."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Hash — Tools</title>
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="brand-line"><a class="brand" href="/">Tools</a></p>
        <p class="tagline">Local-first developer utilities — nothing leaves your browser.</p>
      </div>
      <span id="local-note" class="local-note">Local only</span>
    </header>
    <noscript>
      <p class="noscript">
        These utilities run entirely in your browser and need JavaScript to work.
      </p>
    </noscript>
    <main class="layout">
      <section class="card" aria-labelledby="hash-input-heading">
        <h2 id="hash-input-heading">Input</h2>
        <label class="input-label" for="hash-input">Text to hash</label>
        <textarea id="hash-input" rows="6" class="mono" spellcheck="false"></textarea>
        <fieldset class="segmented">
          <legend>Algorithm</legend>
          <label>
            <input
              type="radio"
              id="hash-alg-sha256"
              name="hash-algorithm"
              value="SHA-256"
              checked
            />
            <span>SHA-256</span>
          </label>
          <label>
            <input type="radio" id="hash-alg-sha384" name="hash-algorithm" value="SHA-384" />
            <span>SHA-384</span>
          </label>
          <label>
            <input type="radio" id="hash-alg-sha512" name="hash-algorithm" value="SHA-512" />
            <span>SHA-512</span>
          </label>
        </fieldset>
        <fieldset class="segmented">
          <legend>Encoding</legend>
          <label>
            <input type="radio" id="hash-enc-hex" name="hash-encoding" value="hex" checked />
            <span>Hex</span>
          </label>
          <label>
            <input type="radio" id="hash-enc-base64" name="hash-encoding" value="base64" />
            <span>Base64</span>
          </label>
          <label>
            <input type="radio" id="hash-enc-base64url" name="hash-encoding" value="base64url" />
            <span>Base64URL</span>
          </label>
        </fieldset>
        <p id="hash-error" class="error" role="alert" hidden></p>
      </section>

      <section class="card" aria-labelledby="hash-output-heading">
        <h2 id="hash-output-heading">Digest</h2>
        <p id="hash-status" class="status" aria-live="polite"></p>
        <div class="copy-row">
          <pre id="hash-output"></pre>
          <button type="button" id="hash-copy">Copy</button>
        </div>
      </section>
    </main>
    <footer class="app-footer">
      <p id="footer-note">All tools run locally in your browser.</p>
    </footer>
    <script type="module" src="/src/pages/hash/main.ts"></script>
  </body>
</html>
